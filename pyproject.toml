[project]
name = "landslide-figures"
version = "1.0.0"
description = "Figure and table reproduction code for Scheip et al., eastern Kentucky 2022 landslide event"
readme = "README.md"
requires-python = "==3.11.*"
license = { file = "LICENSE" }
authors = [{ name = "Corey Scheip", email = "cscheip@bgcengineering.com" }]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "xarray",
    "geopandas",
    "rasterio",
    "rioxarray",
    "shapely",
    "fiona",
    "pyproj",
    "rasterstats",
    "matplotlib",
    "seaborn",
    "tqdm",
]

# No build-system table: uv treats this as a virtual project, so it creates and
# manages the environment without trying to build/install the repository itself.
